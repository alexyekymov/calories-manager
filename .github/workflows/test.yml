name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup Java and Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Get current version
        id: current
        run: |
            echo "NEW_VERSION=$(./gradlew -q printVersion)" >> $GITHUB_ENV

      - name: Check if Docker image tag exists on Docker Hub
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGENAME }}
          TAG: ${{ env.NEW_VERSION }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://hub.docker.com/v2/repositories/$IMAGE/tags/$TAG/)
          if [ "$STATUS" = "200" ]; then
            echo "❌ Tag '$TAG' already exists in Docker Hub for image '$IMAGE'!"
            echo "🚫 The build stage will be skipped to avoid overwriting an existing image."
            echo "🔧 Please bump the version in build.gradle before pushing."
            exit 0
          else
            echo "✅ Tag '$TAG' does not exist, proceeding with build."
          fi

      - name: run tests
        run: ./gradlew test
