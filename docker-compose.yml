services:

  psql:
    image: postgres:16.3
    container_name: psql-caloman
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - psql-caloman-data:/var/lib/postgresql/data

volumes:
  psql-caloman-data:
