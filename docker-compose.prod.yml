services:

  app:
    image: alexyekymov/calories-manager:latest
    container_name: caloman-app
    networks:
      - caloman-net
    depends_on:
      - psql
    env_file:
      - .env
    ports:
      - '8090:8080'

  psql:
    image: postgres:16.3
    container_name: psql-caloman
    networks:
      - caloman-net
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - psql-caloman-data:/var/lib/postgresql/data

  volumes:
    psql-caloman-data:

  networks:
    caloman-net:
      driver: bridge